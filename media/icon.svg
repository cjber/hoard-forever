<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Hoard Forever</title>
  <defs>
    <!-- Family palette: keep these four gradients unchanged in every addon. -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b3741c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame and background: identical in every addon. -->
  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- Emblem: replace this shape. Keep the three layers: shadow (black, 0.45, offset 4 5),
       body (url(#emblem), #5a360c outline 5, round joins), shine (url(#shine), inset). Fit it
       inside x 32-224, y 30-218. -->
  <g stroke="#5a360c" stroke-width="6" stroke-linejoin="round">
    <path d="M58 93 L198 93 L188 188 L68 188 Z" fill="#000" opacity="0.45" transform="translate(4 5)"/>
    <path d="M58 93 L198 93 L188 188 L68 188 Z" fill="url(#emblem)"/>
    <path d="M52 78 L204 78 L198 112 L58 112 Z" fill="url(#emblem)"/>
    <path d="M52 78 L204 78 L198 99 L58 99 Z" fill="url(#shine)" stroke="none"/>
    <path d="M92 111 L92 188 M164 111 L164 188" fill="none" stroke="#7a4f14" stroke-width="9"/>
  </g>
</svg>
